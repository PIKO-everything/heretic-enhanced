# Example configuration for Heretic Enhanced v5.
# Copy this file to config.yaml and adjust values to your needs.
# Never commit real secrets; use environment variables instead.

abliteration:
  model: Qwen/Qwen3-4B-Instruct-2507
  n_trials: 150
  quantization: none                 # none | bnb_4bit
  export_strategy: merge
  device_map: auto                   # remove for CPU-only runs
  # max_shard_size: 4GB
  # batch_size: 8
  # max_batch_size: 16
  attempts: 1
  timeout_minutes: 180

hardware:
  device_map: auto
  num_workers: 1
  vram_gb: 0.0
  batch_size_autotune: false

benchmark:
  enabled: true
  tasks: ["mmlu", "truthfulqa_mc2"]
  limit: null

pipeline:
  convert_to_gguf: false              # requires llama.cpp conversion tools
  ollama_import: false                # requires Ollama installed locally
  upload_to_hf: false                # requires huggingface-cli and HF_TOKEN
  hf_repo_id: null
  abort_on_error: true

notification:
  enable: false
  email:
    smtp_server: ${SMTP_SERVER}
    smtp_port: 587
    username: ${EMAIL_USER}
    password: ${EMAIL_PASS}
    from_addr: ${EMAIL_FROM}
    to_addrs: ["${EMAIL_TO}"]
    use_tls: true
    notify_on: all
  discord:
    url: ${DISCORD_WEBHOOK}
    notify_on: all
  slack:
    url: ${SLACK_WEBHOOK}
    notify_on: all

wandb:
  enabled: false
  project: null
  entity: null

output_root: output
resume: false
dry_run: false
log_level: INFO
